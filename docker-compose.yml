version: '3.8'

services:
  # Serviço de desenvolvimento
  app-dev:
    build:
      context: .
      target: development
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      - VITE_WHATSAPP_NUMBER=${VITE_WHATSAPP_NUMBER}
      - VITE_COMPANY_NAME=${VITE_COMPANY_NAME}
      - VITE_COMPANY_EMAIL=${VITE_COMPANY_EMAIL}
      - VITE_COMPANY_PHONE=${VITE_COMPANY_PHONE}
      - VITE_COMPANY_ADDRESS=${VITE_COMPANY_ADDRESS}
    command: npm run dev -- --host
    networks:
      - repal-network

  # Serviço de produção
  app-prod:
    build:
      context: .
      target: production
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    networks:
      - repal-network
    profiles:
      - production

  # Nginx para desenvolvimento (opcional)
  nginx-dev:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx-dev.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app-dev
    networks:
      - repal-network
    profiles:
      - nginx

networks:
  repal-network:
    driver: bridge

volumes:
  node_modules: